<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Call · seanpatten.com</title>
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;background:#0b0f14;color:#e6edf3;font:17px system-ui;display:grid;place-items:center;text-align:center;padding:1em}button,input{font:inherit;padding:.6em 1.1em;background:#161f2c;color:#fff;border:1px solid #2b3a4d;border-radius:8px}button{cursor:pointer}button:active{background:#8cf;color:#000}.row{display:flex;gap:.5em;justify-content:center;margin:.6em 0}#code{font-size:2.6em;letter-spacing:.15em;font-weight:700;color:#8cf}#s{color:#9fb8c9;min-height:1.4em}</style>
<div id=u>
<h1 style=font-size:3em>☎</h1><p>Talk on any device. No sign-in — share a code.</p>
<div class=row><button id=create>Create call</button></div>
<div class=row><input id=j placeholder=CODE maxlength=4 autocapitalize=characters style="width:6em;text-align:center;text-transform:uppercase"><button id=jb>Join</button></div>
<p id=s></p>
</div>
<audio id=a autoplay playsinline></audio>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const say=t=>s.textContent=t,mic=()=>navigator.mediaDevices.getUserMedia({audio:true})
const rand=()=>{let x='';for(i=0;i<4;i++)x+='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*31|0];return x}
const hook=c=>{window.__c=c;c.on('stream',st=>{a.srcObject=st;a.play&&a.play().catch(()=>{});u.innerHTML='<h1 style=font-size:3em>🔊</h1><p>Connected — talking.</p>'})}
async function host(){const C=rand();location.hash=C;const m=await mic().catch(e=>say('Mic blocked ('+e.name+')'));if(!m)return
 const p=new Peer('scall-'+C);u.querySelector('.row').innerHTML='<div id=code>'+C+'</div>';say('Share code '+C+' — waiting…')
 p.on('call',c=>{c.answer(m);hook(c)});p.on('error',e=>say(e.type))}
async function join(C){C=(C||'').toUpperCase().trim();if(!C)return;const m=await mic().catch(e=>say('Mic blocked ('+e.name+')'));if(!m)return
 const p=new Peer();say('Calling '+C+'…');p.on('open',()=>hook(p.call('scall-'+C,m)));p.on('error',e=>say(e.type=='peer-unavailable'?'No call '+C:e.type))}
create.onclick=host;jb.onclick=()=>join(j.value);if(location.hash.length>1)join(location.hash.slice(1))
</script>
