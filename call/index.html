<style>#a{width:100%}#b{position:fixed;right:8px;bottom:8px;width:22%}</style>
<video id=a autoplay playsinline></video>
<video id=b autoplay playsinline muted></video>
<script src=https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js></script>
<script>
ok=r=>{a.srcObject=r;m.textContent='connected'}
g=c=>navigator.mediaDevices.getUserMedia(c)
g({audio:1,video:1}).catch(_=>g({audio:1})).then(s=>{
b.srcObject=s
if(location.hash){p=new Peer;p.on('open',()=>p.call('seanc-'+location.hash.slice(1),s).on('stream',ok))}
else{C=Math.random().toString(36).slice(2);p=new Peer('seanc-'+C)
p.on('open',()=>location.hash=C)
p.on('call',c=>{c.on('stream',ok).answer(s)})}
})
</script>
<p id=m>
