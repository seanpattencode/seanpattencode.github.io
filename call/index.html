<style>#a{width:100%}#b{position:fixed;right:8px;bottom:8px;width:22%}</style>
<video id=a autoplay playsinline></video>
<video id=b autoplay playsinline muted></video>
<script src=https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js></script>
<script>
ok=r=>{a.srcObject=r;m.textContent='connected'}
g=c=>navigator.mediaDevices.getUserMedia(c)
g({audio:1,video:1}).catch(_=>g({audio:1})).then(s=>{
b.srcObject=s
R=location.hash.slice(1)||Math.random().toString(36).slice(2)
location.hash=R;m.textContent=R
h=new Peer('seanc-'+R)  // first one here hosts the room; id taken = someone has it, join them
h.on('call',c=>{c.on('stream',ok).answer(s)})
h.on('error',e=>e.type=='unavailable-id'&&(p=new Peer).on('open',()=>p.call('seanc-'+R,s).on('stream',ok)))
})
</script>
<p id=m>
